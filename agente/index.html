<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente Inteligente - Problemáticas Sociales</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                
                Agente Inteligente - Problemáticas Sociales
            </h1>
            <p>Análisis automatizado de problemáticas del foro Replit Community</p>
        </div>

        
        <div class="stats">
            <div class="stat-card primary">
                <h3>Total de Posts</h3>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card success">
                <h3>Área Social Top</h3>
                <div class="value" id="stat-problems" style="font-size: 1.2rem;">-</div>
            </div>
            <div class="stat-card warning">
                <h3>Área Tecnológica Top</h3>
                <div class="value" id="stat-no-problems" style="font-size: 1.2rem;">-</div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="search">🔍 Buscar</label>
                    <input type="text" id="search" placeholder="Título, problemática, contenido...">
                </div>
                <div class="filter-group">
                    <label for="area-social">📊 Área Social</label>
                    <select id="area-social">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="area-tech">💻 Área Tecnológica</label>
                    <select id="area-tech">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button class="btn btn-success" onclick="exportCSV()">
                        📥 Exportar CSV
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Header -->
        <div class="results-header">
            <div class="results-count" id="results-count">0 resultados</div>
            <button class="btn btn-secondary" onclick="resetFilters()">
                🔄 Limpiar filtros
            </button>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Cargando problemáticas...</div>
        </div>

        <!-- Cards Grid -->
        <div class="cards-grid" id="cards-grid"></div>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display: none;">
            <h3>No se encontraron resultados</h3>
            <p>Intenta ajustar los filtros de búsqueda</p>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modal-title"></h2>
                    <div class="card-meta" id="modal-meta"></div>
                </div>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let allProblematicas = [];
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

        // Cargar datos al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            loadFilters();
            
            // Event listeners para filtros
            document.getElementById('search').addEventListener('input', debounce(filterData, 300));
            document.getElementById('area-social').addEventListener('change', filterData);
            document.getElementById('area-tech').addEventListener('change', filterData);
        });

        // Debounce para búsqueda
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Cargar datos
        async function loadData() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('cards-grid').style.display = 'none';
                document.getElementById('empty-state').style.display = 'none';

                const response = await fetch(`${API_URL}/problematicas`);
                const result = await response.json();

                if (result.success) {
                    allProblematicas = result.data;
                    displayData(allProblematicas);
                    loadStats();
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar los datos. Verifica que la API esté corriendo en http://localhost:5000');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Cargar estadísticas
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/estadisticas`);
                const result = await response.json();

                if (result.success) {
                    document.getElementById('stat-total').textContent = result.data.total;
                    
                    // Mostrar top área social
                    const topSocial = result.data.areas_sociales[0];
                    if (topSocial) {
                        document.getElementById('stat-problems').textContent = topSocial.area_social;
                    }
                    
                    // Mostrar top área tecnológica
                    const topTech = result.data.areas_tecnologicas[0];
                    if (topTech) {
                        document.getElementById('stat-no-problems').textContent = topTech.area_tecnologica;
                    }
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Cargar opciones de filtros
        async function loadFilters() {
            try {
                const response = await fetch(`${API_URL}/areas`);
                const result = await response.json();

                if (result.success) {
                    const socialSelect = document.getElementById('area-social');
                    const techSelect = document.getElementById('area-tech');

                    result.data.areas_sociales.forEach(area => {
                        const option = document.createElement('option');
                        option.value = area;
                        option.textContent = area;
                        socialSelect.appendChild(option);
                    });

                    result.data.areas_tecnologicas.forEach(area => {
                        const option = document.createElement('option');
                        option.value = area;
                        option.textContent = area;
                        techSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading filters:', error);
            }
        }

        // Filtrar datos
        function filterData() {
            const search = document.getElementById('search').value.toLowerCase();
            const areaSocial = document.getElementById('area-social').value;
            const areaTech = document.getElementById('area-tech').value;

            let filtered = allProblematicas;

            if (search) {
                filtered = filtered.filter(p => 
                    p.titulo.toLowerCase().includes(search) ||
                    (p.descripcion && p.descripcion.toLowerCase().includes(search)) ||
                    (p.area_social && p.area_social.toLowerCase().includes(search))
                );
            }

            if (areaSocial) {
                filtered = filtered.filter(p => p.area_social === areaSocial);
            }

            if (areaTech) {
                filtered = filtered.filter(p => p.area_tecnologica === areaTech);
            }

            displayData(filtered);
        }

        // Mostrar datos
        function displayData(data) {
            const grid = document.getElementById('cards-grid');
            const emptyState = document.getElementById('empty-state');
            const resultsCount = document.getElementById('results-count');

            resultsCount.textContent = `${data.length} resultado${data.length !== 1 ? 's' : ''}`;

            if (data.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';

            grid.innerHTML = data.map(item => createCard(item)).join('');
        }

        // Crear tarjeta
        function createCard(item) {
            const isFavorite = favorites.includes(item.id);
            const hasContent = item.descripcion && item.descripcion !== 'Sin contenido';
            
            return `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">${item.titulo}</div>
                    </div>
                    <div class="card-meta">
                        <span>📅 ${formatDate(item.fecha_analisis)}</span>
                    </div>
                    ${hasContent ? `<div class="card-content"><p>${item.descripcion}</p></div>` : ''}
                    <div class="card-tags">
                        ${item.area_social && item.area_social !== 'N/A' ? `<span class="tag area-social">📊 ${item.area_social}</span>` : ''}
                        ${item.area_tecnologica && item.area_tecnologica !== 'N/A' ? `<span class="tag area-tech">💻 ${item.area_tecnologica}</span>` : ''}
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-primary btn-small" onclick='viewDetail(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
                            👁️ Ver detalles
                        </button>
                        ${item.url_fuente ? `<button class="btn btn-secondary btn-small" onclick="window.open('${item.url_fuente}', '_blank')">🔗 Abrir post</button>` : ''}
                        <button class="btn btn-secondary btn-small" onclick="toggleFavorite(${item.id})" id="fav-${item.id}">
                            ${isFavorite ? '⭐' : '☆'}
                        </button>
                    </div>
                </div>
            `;
        }

        // Ver detalle
        function viewDetail(item) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const meta = document.getElementById('modal-meta');
            const body = document.getElementById('modal-body');

            title.textContent = item.titulo;
            meta.innerHTML = `
                <span>📅 ${formatDate(item.fecha_analisis)}</span>
            `;

            body.innerHTML = `
                <div class="detail-section">
                    <h3>Información General</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <strong>ID</strong>
                            <span>${item.id}</span>
                        </div>
                        <div class="detail-item">
                            <strong>Fecha de análisis</strong>
                            <span>${formatDate(item.fecha_analisis)}</span>
                        </div>
                        <div class="detail-item">
                            <strong>Área Social</strong>
                            <span>${item.area_social || 'N/A'}</span>
                        </div>
                        <div class="detail-item">
                            <strong>Área Tecnológica</strong>
                            <span>${item.area_tecnologica || 'N/A'}</span>
                        </div>
                    </div>
                </div>

                ${item.descripcion ? `
                    <div class="detail-section">
                        <h3>Descripción</h3>
                        <p>${item.descripcion}</p>
                    </div>
                ` : ''}

                ${item.solucion && item.solucion !== 'N/A' ? `
                    <div class="detail-section">
                        <h3>Solución Sugerida</h3>
                        <p>${item.solucion}</p>
                    </div>
                ` : ''}

                ${item.url_fuente ? `
                    <div class="detail-section">
                        <a href="${item.url_fuente}" target="_blank" class="btn btn-primary">
                            🔗 Ver fuente original
                        </a>
                    </div>
                ` : ''}
            `;

            modal.classList.add('active');
        }

        // Cerrar modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Toggle favorito
        function toggleFavorite(id) {
            const index = favorites.indexOf(id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            
            const btn = document.getElementById(`fav-${id}`);
            btn.textContent = favorites.includes(id) ? '⭐' : '☆';
        }

        // Resetear filtros
        function resetFilters() {
            document.getElementById('search').value = '';
            document.getElementById('area-social').value = '';
            document.getElementById('area-tech').value = '';
            displayData(allProblematicas);
        }

        // Exportar CSV
        async function exportCSV() {
            try {
                const response = await fetch(`${API_URL}/export/csv`);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `problematicas_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            } catch (error) {
                console.error('Error:', error);
                alert('Error al exportar CSV');
            }
        }

        // Formatear fecha
        function formatDate(dateStr) {
            if (!dateStr) return 'N/A';
            const date = new Date(dateStr);
            return date.toLocaleDateString('es-CL', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Cerrar modal con ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Cerrar modal al hacer click fuera
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });
    </script>
</body>
</html>
